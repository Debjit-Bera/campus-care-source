<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile – CampusCare</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-role="any" data-page="profile" data-title="Profile">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="two-col" style="grid-template-columns:1fr 1.5fr">
        <aside>
          <section class="card profile-card">
            <div class="avatar" id="profAvatar">U</div>
            <h3 id="profName"></h3>
            <p class="muted" id="profEmail" style="margin-bottom:10px"></p>
            <span class="role-pill" id="profRole"></span>
            <div class="mini-stats"><div><b id="profTotal">0</b><small id="profTotalLabel">Complaints</small></div><div><b id="profResolved">0</b><small>Resolved</small></div></div>
            <div class="profile-meta"><div><span>Member since</span><b id="profSince"></b></div></div>
            <button class="btn btn-danger btn-block" id="logoutBtn" style="margin-top:16px"><i data-lucide="log-out"></i> Log out</button>
          </section>
        </aside>
        <div>
          <form class="card" id="profileForm" novalidate>
            <h3>Edit profile</h3>
            <div class="form-row">
              <div class="field"><label for="editName">Full name</label><input class="input" id="editName"></div>
              <div class="field"><label for="editDept">Department</label><input class="input" id="editDept" placeholder="e.g. Computer Science"></div>
            </div>
            <button class="btn btn-primary" type="submit"><i data-lucide="save"></i> Save changes</button>
          </form>
          <form class="card" id="passwordForm" novalidate>
            <h3>Change password</h3>
            <div class="field"><label for="curPass">Current password</label><input class="input" type="password" id="curPass" autocomplete="current-password"></div>
            <div class="form-row">
              <div class="field"><label for="newPass">New password</label><input class="input" type="password" id="newPass" autocomplete="new-password"></div>
              <div class="field"><label for="confPass">Confirm new password</label><input class="input" type="password" id="confPass" autocomplete="new-password"></div>
            </div>
            <button class="btn btn-primary" type="submit"><i data-lucide="key-round"></i> Update password</button>
          </form>
          <section class="card">
            <h3>Demo data</h3>
            <div class="alert alert-info"><i data-lucide="info"></i><span>CampusCare stores everything in this browser's LocalStorage. Other browsers and devices will not see this data.</span></div>
            <button class="btn btn-outline" id="resetBtn"><i data-lucide="rotate-ccw"></i> Reset demo data</button>
          </section>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
</body>
</html>
